<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Square Fight</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="hud-row">
        
        <div class="hud-side hud-side-left">
          <div class="hud-charge-col">
            <div id="charge-bar2-left-wrap" class="charge-wrap">
              <div id="charge-bar2-left" class="charge-fill"></div>
            </div>
            <div id="charge-bar-left-wrap" class="charge-wrap">
              <div id="charge-bar-left" class="charge-fill"></div>
            </div>
          </div>
          <div id="scale-badge-left" class="scale-badge">
            <span id="scale-val-left" class="scale-val"></span>
            <span id="scale-lbl-left" class="scale-lbl"></span>
          </div>
        </div>

        <div class="hp-wrapper">
          <div class="hp-card">
            <div class="hp-header">
              <span id="name-left" class="name-text">---</span>
              <span id="val-left" class="val-text">100/100</span>
            </div>
            <div class="hp-bar-bg">
              <div id="fill-left" class="hp-bar-fill"></div>
              <div id="poison-left" class="hp-bar-poison"></div>
              <div id="bleed-left" class="hp-bar-bleed"></div>
            </div>
            <div class="cd-container">
              <div id="cd-left" class="cd-fill"></div>
            </div>
          </div>
          <div class="hp-card">
            <div class="hp-header">
              <span id="name-right" class="name-text">---</span>
              <span id="val-right" class="val-text">100/100</span>
            </div>
            <div class="hp-bar-bg">
              <div id="fill-right" class="hp-bar-fill"></div>
              <div id="poison-right" class="hp-bar-poison"></div>
              <div id="bleed-right" class="hp-bar-bleed"></div>
            </div>
            <div class="cd-container">
              <div id="cd-right" class="cd-fill"></div>
            </div>
          </div>
        </div>

        <div class="hud-side hud-side-right">
          <div id="scale-badge-right" class="scale-badge">
            <span id="scale-val-right" class="scale-val"></span>
            <span id="scale-lbl-right" class="scale-lbl"></span>
          </div>
          <div class="hud-charge-col">
            <div id="charge-bar-right-wrap" class="charge-wrap">
              <div id="charge-bar-right" class="charge-fill"></div>
            </div>
            <div id="charge-bar2-right-wrap" class="charge-wrap">
              <div id="charge-bar2-right" class="charge-fill"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div id="select-screen">
      <div class="sides-container">
        <div class="selection-container">
          <div id="side-p1" class="select-side" onclick="SFX.uiClick(); enterGrid(0)">
            <span class="side-label">PLAYER 1</span>
            <div id="prev-p1" class="preview-square"></div>
            <div id="name-label-p1" class="square-name-label"></div>
            <div id="grid-p1" class="grid-layout"></div>
            <div id="skill-p1" class="skill-box">
              <span class="skill-desc">---</span>
            </div>
          </div>
          <div id="side-p2" class="select-side" onclick="SFX.uiClick(); enterGrid(1)">
            <span class="side-label">PLAYER 2</span>
            <div id="prev-p2" class="preview-square"></div>
            <div id="name-label-p2" class="square-name-label"></div>
            <div id="grid-p2" class="grid-layout"></div>
            <div id="skill-p2" class="skill-box">
              <span class="skill-desc">---</span>
            </div>
          </div>
        </div>
      </div>
      <button id="start-fight-btn" onclick="SFX.uiClick(); startBattle()">FIGHT</button>
    </div>

    <div id="win-overlay" onclick="if (window.winScreenVisible) { SFX.uiClick(); resetBattle(); }"></div>
    <div id="win-content" onclick="if (window.winScreenVisible) { SFX.uiClick(); resetBattle(); }">
      <div id="win-text"></div>
      <div id="win-subtext">CLICK OR PRESS 'R' TO REENGAGE</div>
    </div>

    <div id="controls">
      P1: Z (Flip X) X (Flip Y) C (Speed) | P2: J (Flip X) K (Flip Y) L (Speed) | R: Reset | Mobile: Swipe ↔ Flip X · Swipe ↕ Flip Y · Tap = Speed
    </div>

    <!-- Mobile on-screen controls -->
    <div id="mobile-controls">
      <div class="mobile-player-btns" id="mobile-p1">
        <button class="mob-btn" id="mob-p1-flip" ontouchstart="event.preventDefault(); SFX.uiClick(); _mobileAction(0,'flip')" onclick="SFX.uiClick(); _mobileAction(0,'flip')">FLIP</button>
        <button class="mob-btn" id="mob-p1-chase" ontouchstart="event.preventDefault(); SFX.uiClick(); _mobileAction(0,'chase')" onclick="SFX.uiClick(); _mobileAction(0,'chase')">CHASE</button>
        <button class="mob-btn" id="mob-p1-speed" ontouchstart="event.preventDefault(); SFX.uiClick(); _mobileAction(0,'speed')" onclick="SFX.uiClick(); _mobileAction(0,'speed')">SPEED</button>
      </div>
      <div class="mobile-player-btns" id="mobile-p2">
        <button class="mob-btn" id="mob-p2-flip" ontouchstart="event.preventDefault(); SFX.uiClick(); _mobileAction(1,'flip')" onclick="SFX.uiClick(); _mobileAction(1,'flip')">FLIP</button>
        <button class="mob-btn" id="mob-p2-chase" ontouchstart="event.preventDefault(); SFX.uiClick(); _mobileAction(1,'chase')" onclick="SFX.uiClick(); _mobileAction(1,'chase')">CHASE</button>
        <button class="mob-btn" id="mob-p2-speed" ontouchstart="event.preventDefault(); SFX.uiClick(); _mobileAction(1,'speed')" onclick="SFX.uiClick(); _mobileAction(1,'speed')">SPEED</button>
      </div>
    </div>

    <div id="bottom-left-btns">
      <button id="roster-btn" onclick="SFX.uiClick(); currentScreen = currentScreen === 'battle' ? 'select' : 'battle'">
        SQUARES
      </button>
      <button id="reset-btn" onclick="SFX.uiClick(); resetBattle()">RESET</button>
    </div>

    <canvas id="game"></canvas>

    <script src="js/sfx.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/behaviorRegistry.js"></script>
    <script src="js/characters.js"></script>
    <script src="js/square.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>

    <script>
      canvas = document.getElementById("game");
      ctx = canvas.getContext("2d");
      resize();
      resetBattle();
      loop();
    </script>
  </body>
</html>
